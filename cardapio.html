<head>
    <meta charset="UTF-8">

    <title>Cantina da Nonna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="public/style/index.css">

<body>
    <nav>
        <a href="index.html">Cantina da Nonna</a>

        <div class="links-nav">
            <a href="index.html">Início</a>
            <a href="cardapio.html">Cardápio</a>
            <a href="reserva.html">Reserva</a>
        </div>
    </nav>

    <main class="container mt-4">
        <h1>Cardápio</h1>

        <div class="d-flex mb-4 gap-2" id="filtro">
            <button class="btn btn-small btn-outline-secondary" data-filtro="todos">Todos</button>
            <button class="btn btn-small btn-outline-secondary" data-filtro="massas">Massas</button>
            <button class="btn btn-small btn-outline-secondary" data-filtro="pizzas">Pizzas</button>
            <button class="btn btn-small btn-outline-secondary" data-filtro="vinhos">Vinhos</button>
            <button class="btn btn-small btn-outline-secondary" data-filtro="entradas">Entradas</button>
        </div>

        <div class="row" id="cardapio"></div>

        <div class="modal fade" id="apagarProdutoModal" tabindex="-1" aria-labelledby="apagarProdutoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="apagarProdutoModalLabel"></h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-Label="Close"></button>
                    </div>
                    <div class="modal-body" id="apagarProdutoModalCorpo"></div>
                    <div class="modal-footer">
                        <img class="reload-img" src="/public/images/reload.gif" alt="Recarregar" hidden="true" id="elementoBotaoImagemRecarregar"/>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="apagarProdutoModalCancelar">Cancelar</button>
                        <button type="button" class="btn btn-danger" id="apagarProdutoModalConfirmar">Confirmar</button>
                    </div>
                </div>
            </div>
        </div>
            
    
    </main>

    <a class="botao-cadastro-produto" onClick="mostrarCadastroProdutos()">Criar produto</a>

    <footer>
        <div>
            <section>
                <h2>Contato</h2>
                <p>Telefone: <a href="https://wa.me/5548987654321" target="_blank">(48) 9 8765 - 4321</a></p>
                <p>email: <a href="mailto:contato@nonna.com.br">contato@nonna.com.br</a></p>
                <p>Instragram: <a href="https://instagram.com.br/nonna">@nonna</a></p>
            </section>
            <section>
                <h2>Localização</h2>
                <p>Rua das Oliveiras, 120</p>
                <p>Centro - Araranguá/SC</p>

                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13966.543414224649!2d-49.49170902969789!3d-28.938859202589764!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95222edfcf15aaad%3A0xff24219d9974bb61!2sSenac%20Ararangu%C3%A1!5e0!3m2!1spt-BR!2sbr!4v1784248086985!5m2!1spt-BR!2sbr"
                    width="600" height="350" style="border:0;" allowfullscreen="" loading="lazy"

            </section>
        </div>

        <p>&copy; 2026 Cantina da Nonna.</p>
